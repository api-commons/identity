aid: standard-identity
name: Identity
type: Standard
description: 'De facto standards for the identity layer. SCIM is the odd one out in this programme: it
  was ratified in 2015, so describing it again adds nothing. What was missing is the measurement beside
  it — every operation carries what RFC 7644 says about it AND what the industry actually declares.


  368 providers mention SCIM, the largest claim cohort here. 77 publish a spec containing a SCIM path.'
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
