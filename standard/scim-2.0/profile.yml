profile: scim-2.0
title: SCIM 2.0
originator: IETF
standard_class: ratified
standard_class_note: The other five profiles in this programme describe interfaces that became standards
  by being copied, where no specification exists to check anyone against. SCIM was ratified in 2015. Describing
  it again would add nothing; what is missing is the measurement of what the industry actually built,
  set beside what the RFC actually says.
