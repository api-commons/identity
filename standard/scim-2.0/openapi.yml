components:
  schemas:
    ListResponse:
      type: object
      description: RFC 7644 Section 3.4.2. Every query answers in this envelope, identified by urn:ietf:params:scim:api:messages:2.0:ListResponse.
      required:
      - schemas
      - totalResults
      properties:
        schemas:
          type: array
          items:
            const: urn:ietf:params:scim:api:messages:2.0:ListResponse
        totalResults:
          type: integer
        startIndex:
          type: integer
          description: 1-based, not 0-based.
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            type: object
    Error:
      type: object
      description: RFC 7644 Section 3.12. Identified by urn:ietf:params:scim:api:messages:2.0:Error. `status`
        is a STRING carrying the HTTP status code, which is a common source of client bugs.
      required:
      - schemas
      - status
      properties:
        schemas:
          type: array
          items:
            const: urn:ietf:params:scim:api:messages:2.0:Error
        status:
          type: string
        scimType:
          type: string
          enum:
          - invalidFilter
          - tooMany
          - uniqueness
          - mutability
          - invalidSyntax
          - invalidPath
          - noTarget
          - invalidValue
          - invalidVers
          - sensitive
        detail:
          type: string
    User:
      type: object
      description: 'RFC 7643 Section 4.1. Core schema urn:ietf:params:scim:schemas:core:2.0:User. Only
        `userName` is REQUIRED: "Each User MUST include a non-empty userName value... This attribute is
        REQUIRED and is case insensitive."'
      required:
      - schemas
      - userName
      properties:
        schemas:
          type: array
          items:
            type: string
          description: Includes urn:ietf:params:scim:schemas:core:2.0:User.
        id:
          type: string
          readOnly: true
        externalId:
          type: string
        userName:
          type: string
        name:
          type: object
          properties:
            formatted:
              type: string
            familyName:
              type: string
            givenName:
              type: string
        displayName:
          type: string
        active:
          type: boolean
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              type:
                type: string
              primary:
                type: boolean
        meta:
          $ref: '#/components/schemas/Meta'
    Group:
      type: object
      description: RFC 7643 Section 4.2. Core schema urn:ietf:params:scim:schemas:core:2.0:Group.
      required:
      - schemas
      - displayName
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
          readOnly: true
        displayName:
          type: string
        members:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              $ref:
                type: string
              type:
                type: string
        meta:
          $ref: '#/components/schemas/Meta'
    Meta:
      type: object
      description: RFC 7643 Section 3.1 common attributes.
      properties:
        resourceType:
          type: string
        created:
          type: string
        lastModified:
          type: string
        location:
          type: string
        version:
          type: string
