openapi: 3.1.0
info:
  title: SCIM 2.0 — API Commons profile
  summary: SCIM as the industry actually implements it, beside what the RFC says.
  description: '**SCIM is ratified, so this is not a description of the standard — RFC 7643 and RFC 7644
    already are that.** This is the other axis: every operation carries `x-normative-force` quoting what
    the RFC says about it, and `x-tier` measuring what the industry declares.


    The gap is the artifact. SCIM''s three discovery endpoints — the mechanism that would let a client
    adapt to a server''s capabilities — are declared by about a third of implementers, and the RFC does
    not compel them, so a client cannot rely on discovery and has no grounds to complain.


    Vendor-tier operations are graded in `profile.yml` and excluded here. Measured across 77 providers
    that publish a SCIM path, out of 368 that mention SCIM.'
  version: '2.0'
  contact:
    name: API Commons
    url: https://apicommons.org
  license:
    name: CC-BY-NC-SA-4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
externalDocs:
  description: RFC 7644 — SCIM Protocol
  url: https://www.rfc-editor.org/rfc/rfc7644
servers:
- url: https://{host}/scim/v2
  variables:
    host:
      default: example.com
      description: Any SCIM service provider.
tags:
- name: Groups
- name: ResourceTypes
- name: Schemas
- name: ServiceProviderConfig
- name: Users
