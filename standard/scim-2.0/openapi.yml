        to implement all of them.'
      tags:
      - Users
      x-tier: core
      x-rfc-section: 3.4.1
      x-normative-force: defined
      x-providers-declaring: 53
      responses:
        '200':
          description: Success.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '400':
          description: SCIM error.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
