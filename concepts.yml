context: identity
name: Identity and Users
intro: >-
  The common identity vocabulary -- users, the groups and organizations they belong to, the
  roles and permissions they hold, the invitations that bring them in and the API keys they
  use -- distilled from the APIs that already exist. Cross-cutting: almost every other
  context has users, and this is where their shape is measured.
tags: [Identity, Authentication, Identity Federation, Access Control, IAM, Identity and Access Management, SSO, Single Sign-On, User Management, Authorization, CIAM]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, schemas,
           Resources, itemsPerPage, startIndex, totalResults]

